name: Python quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Scan installed dependency set for known vulnerabilities
        run: |
          python -m pip install pip-audit==2.9.0
          python -m pip_audit
      - name: Check Python syntax
        run: python -m compileall -q app main.py
      - name: Lint errors and undefined names
        run: |
          python -m pip install ruff==0.14.10
          python -m ruff check --select E4,E7,E9,F821,F822,F823 app tests main.py
      - name: Run unit and API tests
        run: python -m pytest -q tests/
