name: Python quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Scan installed dependency set for known vulnerabilities
        run: python -m pip_audit --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Check Python syntax
        run: python -m compileall -q app main.py
      - name: Lint errors and undefined names
        run: python -m ruff check app tests main.py
      - name: Run unit and API tests
        run: python -m pytest -q tests/
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag cryptograph:ci .
      - name: Start the image and check health
        run: |
          container=$(docker run --detach --publish 127.0.0.1:8000:8000 cryptograph:ci)
          trap 'docker logs "$container"; docker rm --force "$container" >/dev/null' EXIT
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 \
            --max-time 5 --retry-max-time 30 http://127.0.0.1:8000/health
