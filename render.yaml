services:
  - type: web
    name: cryptograph
    runtime: python
    buildCommand: python -m pip install --require-hashes -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --limit-concurrency 32 --timeout-keep-alive 5
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
